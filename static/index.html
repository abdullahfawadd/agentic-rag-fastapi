<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic RAG Studio | M Abdullah Fawad</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Workspace navigation">
        <div class="identity-card">
          <div class="brand-mark">AF</div>
          <div class="identity-copy">
            <span>Agentic RAG Studio</span>
            <strong>M Abdullah Fawad</strong>
          </div>
        </div>

        <section class="side-section">
          <div class="side-label">Lab Controls</div>
          <div class="action-list">
            <button class="action-item" id="healthBtn" type="button" title="Run health check">
              <i data-lucide="activity"></i>
              <span>Health check</span>
              <small id="apiStatus">Checking</small>
            </button>
            <button class="action-item" id="ingestBtn" type="button" title="Ingest the PDF">
              <i data-lucide="database-zap"></i>
              <span>Ingest PDF</span>
              <small id="vectorCount">0 vectors</small>
            </button>
            <button class="action-item" id="logsBtn" type="button" title="View tool logs">
              <i data-lucide="list-tree"></i>
              <span>Tool logs</span>
              <small>Trace file</small>
            </button>
          </div>
        </section>

        <section class="side-section">
          <div class="side-label">Knowledge Base</div>
          <div class="kb-card">
            <div>
              <span>Namespace</span>
              <strong id="namespaceName">ai_agents_pdf</strong>
            </div>
            <i data-lucide="file-search"></i>
          </div>
        </section>

        <section class="side-section tool-section">
          <div class="side-label">Tools</div>
          <div class="tool-list">
            <span><i data-lucide="file-search"></i> Pinecone KB</span>
            <span><i data-lucide="radar"></i> Tavily Web</span>
            <span><i data-lucide="library"></i> Wikipedia</span>
            <span><i data-lucide="calculator"></i> Calculator</span>
          </div>
        </section>
      </aside>

      <main class="studio">
        <header class="studio-header">
          <div class="header-copy">
            <span class="kicker">Groq · Pinecone · Tavily · Wikipedia</span>
            <h1>AI Research Assistant</h1>
          </div>
          <div class="header-actions">
            <span class="status-pill">
              <span class="status-dot"></span>
              Lab 06
            </span>
            <a class="docs-link" href="/docs" target="_blank" rel="noreferrer" title="Open Swagger docs">
              <i data-lucide="book-open"></i>
              <span>Swagger</span>
            </a>
          </div>
        </header>

        <section class="conversation-wrap">
          <div class="messages" id="messages" aria-live="polite">
            <section class="welcome-panel" id="welcomePanel">
              <div class="welcome-mark">AF</div>
              <p class="welcome-kicker">Agentic RAG Lab 06</p>
              <h2>What should we investigate?</h2>
              <div class="suggestion-grid" aria-label="Demo prompts">
                <button class="suggestion-card" data-prompt="Give me a Wikipedia summary of the Transformer architecture in NLP.">
                  <i data-lucide="library"></i>
                  <span>
                    <strong>Wikipedia brief</strong>
                    <small>Transformer architecture</small>
                  </span>
                </button>
                <button class="suggestion-card" data-prompt="What are the latest AI agent frameworks?">
                  <i data-lucide="radar"></i>
                  <span>
                    <strong>Live research</strong>
                    <small>Recent agent frameworks</small>
                  </span>
                </button>
                <button class="suggestion-card" data-prompt="What does the AI agents PDF say about tool design?">
                  <i data-lucide="file-search"></i>
                  <span>
                    <strong>PDF citation</strong>
                    <small>Domain knowledge base</small>
                  </span>
                </button>
                <button class="suggestion-card" data-prompt="What does the PDF say about tool use, and how many days are in 5 years?">
                  <i data-lucide="workflow"></i>
                  <span>
                    <strong>Multi-tool trace</strong>
                    <small>KB plus calculator</small>
                  </span>
                </button>
              </div>
            </section>
          </div>
        </section>

        <footer class="composer-dock">
          <form class="composer" id="chatForm">
            <textarea
              id="questionInput"
              rows="1"
              placeholder="Message the agent..."
              autocomplete="off"
            ></textarea>
            <button class="send-button" id="sendBtn" type="submit" title="Send message">
              <i data-lucide="arrow-up"></i>
            </button>
          </form>
        </footer>
      </main>
    </div>
  </body>
</html>
